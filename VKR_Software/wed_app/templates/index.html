<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_FACE_DETECTOR</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0a0a0a;
            --border-color: #222;
            --text-main: #c0c0c0;
            --neon-green: #00ff41;
            --neon-red: #ff0055;
            --neon-blue: #00f0ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 0;
        }

        .top-bar {
            background: #0f0f0f;
            border-bottom: 1px solid var(--neon-blue);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: var(--neon-blue);
        }

        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .header {
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-family: 'VT323', monospace;
            font-size: 3em;
            color: var(--neon-blue);
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .header p {
            color: #555;
            font-size: 0.9em;
        }

        .content { padding: 0 30px 30px; }

        .upload-area {
            border: 1px dashed var(--border-color);
            background: #080808;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--neon-blue);
            background: #0c0c0c;
        }

        .upload-icon {
            font-size: 2.5em;
            color: var(--neon-blue);
            margin-bottom: 10px;
        }

        .upload-area h3 {
            font-family: 'VT323', monospace;
            font-size: 1.8em;
            color: #888;
            margin-bottom: 5px;
        }

        .upload-area p {
            color: #444;
            font-size: 0.85em;
        }

        #fileInput { display: none; }

        .btn {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 12px 30px;
            font-family: 'VT323', monospace;
            font-size: 1.3em;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            display: block;
            margin: 25px auto 0;
        }

        .btn:hover {
            background: var(--neon-green);
            color: #000;
        }

        .btn:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }

        .result-area {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .result-card {
            background: #080808;
            border: 1px solid #222;
            padding: 25px;
            text-align: center;
        }

        .status-text {
            font-family: 'VT323', monospace;
            font-size: 2.5em;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .status-text.real {
            color: var(--neon-green);
        }

        .status-text.fake {
            color: var(--neon-red);
        }

        .stats-grid {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 25px;
        }

        .stat-box { text-align: center; }
        .stat-label { color: #555; font-size: 0.8em; margin-bottom: 5px; }
        .stat-value {
            font-family: 'VT323', monospace;
            font-size: 2em;
            color: #888;
        }

        .visualization {
            border-top: 1px solid #222;
            padding-top: 25px;
        }

        .vis-title {
            font-family: 'VT323', monospace;
            font-size: 1.4em;
            color: var(--neon-blue);
            margin-bottom: 20px;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .img-box {
            background: #050505;
            border: 1px solid #222;
        }

        .img-box img {
            width: 100%;
            display: block;
        }

        .img-label {
            background: #0a0a0a;
            color: #444;
            text-align: center;
            padding: 6px;
            font-size: 0.75em;
            border-top: 1px solid #1a1a1a;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loader {
            width: 80px;
            height: 3px;
            background: #1a1a1a;
            margin: 0 auto 15px;
            position: relative;
            overflow: hidden;
        }

        .loader::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 0%;
            background: var(--neon-green);
            animation: load 1.5s infinite ease-in-out;
        }

        @keyframes load {
            0% { width: 0%; left: 0; }
            50% { width: 100%; left: 0; }
            100% { width: 0%; left: 100%; }
        }

        .loading p {
            color: var(--neon-blue);
            font-size: 0.9em;
        }

        .footer {
            text-align: center;
            padding: 15px;
            color: #333;
            font-size: 0.75em;
            border-top: 1px solid #1a1a1a;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 2em; }
            .stats-grid { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <span>СИСТЕМА: AI_DETECTOR</span>
            <span>СТАТУС: <span class="blink">●</span> АКТИВЕН</span>
        </div>

        <div class="header">
            <h1>AI FACE DETECTOR</h1>
            <p>/// НЕЙРОСЕТЕВОЙ АНАЛИЗ ИЗОБРАЖЕНИЙ ///</p>
        </div>

        <div class="content">
            <form id="uploadForm">
                <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">◉</div>
                    <h3>ЗАГРУЗИТЬ ФОТО</h3>
                    <p>[ ПЕРЕТАЩИТЕ ИЛИ НАЖМИТЕ ]</p>
                    <input type="file" name="file" id="fileInput" accept="image/*" required>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">АНАЛИЗИРОВАТЬ</button>
            </form>

            <div class="loading" id="loadingArea">
                <div class="loader"></div>
                <p>ОБРАБОТКА ИЗОБРАЖЕНИЯ...</p>
            </div>

            <div class="result-area" id="resultArea">
                <div class="result-card">
                    <div id="status" class="status-text"></div>
                    
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-label">НАСТОЯЩЕЕ</div>
                            <div class="stat-value" id="realProb" style="color: var(--neon-green)">0%</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">СИНТЕТИКА</div>
                            <div class="stat-value" id="fakeProb" style="color: var(--neon-red)">0%</div>
                        </div>
                    </div>

                    <div class="visualization">
                        <div class="vis-title">:: КАРТА АКТИВАЦИИ ::</div>
                        <div class="images-grid">
                            <div class="img-box">
                                <img id="facePreview" src="" alt="Face">
                                <div class="img-label">ЛИЦО</div>
                            </div>
                            <div class="img-box">
                                <img id="heatmapPreview" src="" alt="Heatmap">
                                <div class="img-label">ТЕПЛОВАЯ КАРТА</div>
                            </div>
                            <div class="img-box">
                                <img id="overlayPreview" src="" alt="Overlay">
                                <div class="img-label">РЕЗУЛЬТАТ</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>ВКР | 2026 | EFFICIENTNET-B4 + CBAM</p>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadForm = document.getElementById('uploadForm');
        const loadingArea = document.getElementById('loadingArea');
        const resultArea = document.getElementById('resultArea');
        const submitBtn = document.getElementById('submitBtn');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length) { fileInput.files = files; updateFileName(files[0].name); }
        }, false);

        fileInput.addEventListener('change', function() {
            if (this.files.length) updateFileName(this.files[0].name);
        });

        function updateFileName(name) {
            dropZone.querySelector('h3').textContent = `> ФАЙЛ: ${name}`;
            dropZone.querySelector('p').textContent = '[ ГОТОВ К АНАЛИЗУ ]';
        }

        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!fileInput.files.length) {
                alert('ОШИБКА: ФАЙЛ НЕ ВЫБРАН');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            loadingArea.style.display = 'block';
            resultArea.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'ОБРАБОТКА...';

            try {
                const response = await fetch('/predict', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success) {
                    displayResult(data);
                } else {
                    alert('ОШИБКА: ' + (data.error || 'АНАЛИЗ НЕ УДАЛСЯ'));
                }
            } catch (error) {
                alert('ОШИБКА СОЕДИНЕНИЯ');
                console.error(error);
            } finally {
                loadingArea.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.textContent = 'АНАЛИЗИРОВАТЬ';
            }
        });

        function displayResult(data) {
            const statusDiv = document.getElementById('status');
            const realProbDiv = document.getElementById('realProb');
            const fakeProbDiv = document.getElementById('fakeProb');
            const facePreview = document.getElementById('facePreview');
            const heatmapPreview = document.getElementById('heatmapPreview');
            const overlayPreview = document.getElementById('overlayPreview');

            const isFake = data.label.includes('FAKE');
            statusDiv.textContent = isFake ? '>>> СИНТЕТИКА <<<' : '>>> НАСТОЯЩЕЕ <<';
            statusDiv.className = 'status-text ' + (isFake ? 'fake' : 'real');

            realProbDiv.textContent = data.real_prob;
            fakeProbDiv.textContent = data.fake_prob;

            facePreview.src = data.face_image;
            heatmapPreview.src = data.heatmap;
            overlayPreview.src = data.overlay;

            resultArea.style.display = 'block';
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
